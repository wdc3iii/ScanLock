/**:
  ros__parameters:
    pose_prompt:
      pcd_file_name: "caltech_0.pcd"    # PCD map: rel. name (under <pkg>/pcd/), absolute path, or $ENV_VAR path
      coarse_voxel_size: 2.0            # Voxel size (m) for the fast-orbiting full-map overview
      fine_voxel_size: 0.2              # Voxel size (m) for the fine region crop (must be > 0)
      fine_region_radius: 20.0          # Half-width (m) of the fine crop around a clicked point
      fine_point_cap: 1000000           # Warn + coarsen fine crop if it exceeds this many points

    frames:
      map_frame: "map"                 # Map frame (parent of odom)

    topics:
      region_point_topic: "/clicked_point"  # RViz "Publish Point" tool topic (region select)
